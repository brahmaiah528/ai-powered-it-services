version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: itsm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: itsm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d itsm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itsm-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/itsm_db
      SECRET_KEY: enterprise-itsm-super-secret-jwt-key-production-ready
      DEMO_MODE: "true"
      JIRA_URL: https://company-itsm.atlassian.net
      JIRA_EMAIL: devops-lead@enterprise.org
      JIRA_PROJECT_KEY: ITSM
      GITHUB_REPOSITORY: enterprise-org/it-service-management
      JENKINS_URL: http://jenkins.internal.company.com:8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itsm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
